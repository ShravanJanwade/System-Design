<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blueprint teaches system design from your first request to FAANG-level interviews." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Blueprint</title>
    <script>
      // Apply the saved theme, text size and motion preference before first paint.
      (function () {
        try {
          var raw = localStorage.getItem('blueprint-settings');
          var s = raw ? JSON.parse(raw).state || {} : {};
          var theme = s.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.text = s.textSize || 'default';
          var rm = s.reducedMotion || 'system';
          var reduce = rm === 'reduce' || (rm === 'system' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          root.dataset.motion = reduce ? 'reduce' : 'full';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
